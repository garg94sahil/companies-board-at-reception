<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Haus+ Reception</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="scene">
  <div class="warp" id="warp">
    <div class="warp__wall warp__wall--top" data-side="top"></div>
    <div class="warp__wall warp__wall--bottom" data-side="bottom"></div>
    <div class="warp__wall warp__wall--left" data-side="left"></div>
    <div class="warp__wall warp__wall--right" data-side="right"></div>
  </div>

  <header class="brand">
    <img class="brand__logo" src="assets/haus-logo/haus-plus-wordmark-white.png" alt="Haus+">
  </header>

  <main id="clients" class="clients" aria-label="Companies at this location"></main>
</div>

<script src="js/app.js"></script>
</body>
</html>
